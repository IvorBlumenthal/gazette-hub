[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# "gazette" (the live, on-demand search/category function) intentionally has
# no [functions."gazette"] timeout entry here. It used to declare timeout=26,
# but that was dead configuration -- Netlify's synchronous function limit is
# a fixed 60 seconds and isn't configurable via netlify.toml (confirmed via
# their docs, and empirically: a live request measured at 36s completed
# successfully, which a real 26s cap would have killed). lib/ai.js's
# LIVE_REQUEST_TIMEOUT_MS is deliberately kept under the real 60s ceiling.

[functions."gazette-scheduler"]
  timeout = 900

[functions."newsletter-generator"]
  timeout = 900

[functions."newsletter-admin"]
  timeout = 60

[functions."gazette-alert"]
  timeout = 900

# Runs every Monday at 04:00 UTC = 06:00 SAST
[[scheduled-functions]]
  name = "gazette-scheduler"
  cron = "0 4 * * 1"

# Runs every Friday at 04:00 UTC = 06:00 SAST — flags new notices since last
# week's scan and emails a summary (only if something's actually new).
[[scheduled-functions]]
  name = "gazette-alert"
  cron = "0 4 * * 5"

# Runs on the 1st of every month at 05:00 UTC = 07:00 SAST
[[scheduled-functions]]
  name = "newsletter-generator"
  cron = "0 5 1 * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
